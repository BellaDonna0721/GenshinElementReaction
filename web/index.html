<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenshinElement - 元素反应原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', monospace;
      color: #ccc;
    }
    h1 {
      margin: 12px 0 4px;
      font-size: 20px;
      color: #e0c080;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }
    canvas {
      border: 2px solid #333;
      border-radius: 4px;
      display: block;
      cursor: crosshair;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      padding: 6px 16px;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>GenshinElement</h1>
  <p class="subtitle">原神元素反应系统demo</p>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div class="controls">
    <button id="btnReset">重置</button>
    <span style="font-size:12px;color:#888;">
      WASD 移动 | 鼠标左键 发射子弹
    </span>
  </div>

  <script src="../dist/game.js"></script>
  <script type="module" src="../dist/main.js"></script>
</body>
</html>
